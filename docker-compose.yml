version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: defectguard
      POSTGRES_PASSWORD: defectguard
      POSTGRES_DB: defectguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml_artifacts:/app/ml_artifacts

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
